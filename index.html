<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>텔레그램 신규 가입 신청 - MNQ</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Malgun Gothic;padding:20px}
.form{max-width:480px;margin:auto;background:#1e1e1e;padding:20px;border-radius:10px}
input,select,textarea{width:100%;padding:10px;margin:8px 0;background:#2a2a2a;border:1px solid #444;color:#fff;border-radius:6px}
button{width:100%;padding:14px;background:#0088cc;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
label{font-size:13px;color:#aaa}
</style>
</head>
<body>
<div class="form">
<h2>텔레그램 신규 가입 신청 - MNQ</h2>
<p style="font-size:12px;color:#888">NPOINT 04ac6b88e333695ed90b | ACCOUNT 7020-3101 고정(4943-9764) | 실명 공유 (Admin/User/텔레그램폼)</p>
<label>실명(예: 김성택)</label>
<input id="real_name" placeholder="김성택">
<label>전화번호</label>
<input id="phone" placeholder="010-0000-0000">
<label>계좌번호 7020-3101</label>
<input id="account" placeholder="7020-3101">
<label>텔레그램 ID</label>
<input id="telegram_id" placeholder="@username">
<label>투자 유형</label>
<select id="invest_type"><option>MNQ 실매매 복제</option><option>모의투자</option></select>
<label>신청 메모</label>
<textarea id="memo" rows="3"></textarea>
<button onclick="submitApply()">가입 신청 - telegram_applies 저장</button>
<div id="result" style="margin-top:12px;font-size:12px;color:#0f0"></div>
</div>
<script>
const NPOINT='https://api.npoint.io/04ac6b88e333695ed90b';
function submitApply(){
 let data={real_name:document.getElementById('real_name').value,phone:document.getElementById('phone').value,account:document.getElementById('account').value||'7020-3101',telegram_id:document.getElementById('telegram_id').value,invest_type:document.getElementById('invest_type').value,memo:document.getElementById('memo').value,ts:Date.now(),status:'pending'};
 let applies=JSON.parse(localStorage.getItem('telegram_applies')||'[]');
 applies.push(data);
 localStorage.setItem('telegram_applies',JSON.stringify(applies));
 document.getElementById('result').innerText='신청 완료: '+data.real_name+' → ADMIN 대기목록으로 전송됨 (npoint: 04ac6b88e333695ed90b)';
 // ADMIN PC mnq_users pending으로 연동
 fetch(NPOINT).then(r=>r.json()).then(j=>{console.log('npoint ok',j);}).catch(e=>{console.log('npoint offline, local saved');});
}
</script>
</body>
</html>
